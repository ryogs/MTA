<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>META ERECTION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400&display=swap">
<style>
html, body { margin: 0; height: 100%; background: #FFFFFF; overscroll-behavior: none; }
body { -webkit-text-size-adjust: 100%; }
#app { position: fixed; top: 0; bottom: 0; left: 0; right: 0; width: 100%; max-width: 430px; margin: 0 auto; }
@media (min-width: 431px) { #app { box-shadow: 0 0 0 1px #E6E6E2; } }
a { color: #0E0E0E; }
a:hover { color: #6A6A66; }
button { font-family: inherit; -webkit-tap-highlight-color: transparent; }
@keyframes mFadeIn{from{opacity:0}to{opacity:1}}
button[data-press]{transition:transform 420ms cubic-bezier(0.3,1.45,0.45,1)}
button[data-mta]:active>span{transform:translateY(2px);filter:drop-shadow(0 0 0 rgba(255,255,255,0)) drop-shadow(0 0.5px 0 rgba(14,14,14,0.22)) drop-shadow(0 1px 2px rgba(14,14,14,0.18))!important;transition:transform 80ms ease-out,filter 80ms ease-out!important}
button[data-press]:active{transform:scale(0.88);transition:transform 90ms ease-out}
</style>
</head>
<body>
<div id="app"></div>
<script src="./preact.min.js?v=11191620"></script>
<script src="app.js?v=11191620"></script>
</body>
</html>
